[project]
name = "wims-backend"
version = "0.1.0"
description = "Warehouse & Inventory Management System — Django/DRF API"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # bandit-style security checks
    "T20", # no print statements in app code
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts are fine in tests
    "RUF012", # ClassVar annotations are not required for Django settings
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402", "S105"]
"config/celery.py" = ["T201", "S101"]
"*/tests/*.py" = ["S105", "S106", "T201"]
"apps/*/migrations/*.py" = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest (used when running the suite with pytest-django)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
addopts = "-q --strict-markers"
