# ---------------------------------------------------------------------------
# Edge reverse proxy for the Warehouse & Inventory Management System.
#
#   /api/     -> Django API (gunicorn)
#   /admin/   -> Django admin
#   /static/  -> Django static files (served from the shared volume)
#   /         -> compiled React SPA (frontend container)
#
# TLS: terminate here. Drop certificates into ./nginx/certs and uncomment the
# HTTPS server block (see docs/architecture.md → Security).
# ---------------------------------------------------------------------------

upstream wims_api {
    server api:8000;
    keepalive 16;
}

upstream wims_frontend {
    server frontend:80;
    keepalive 16;
}

# Shared security headers applied to every response.
include /etc/nginx/conf.d/snippets/security-headers.conf;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ---------------------------------------------------------------------
    # Ops endpoints
    # ---------------------------------------------------------------------
    location = /nginx-healthz {
        access_log off;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://wims_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Never cache API responses at the edge.
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Tighter limit on credential endpoints (login, token refresh, …).
    location /api/v1/identity/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://wims_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # Django admin + static assets
    # ---------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://wims_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Single Page Application
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://wims_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

