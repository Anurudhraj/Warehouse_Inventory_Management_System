# ---------------------------------------------------------------------------
# SPA server (frontend container).
#
# The edge proxy forwards every non-API request here; this server serves the
# compiled React bundle and falls back to index.html so client-side routing
# (React Router) works on deep links and refreshes.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Container health probe (used by Docker/compose healthchecks).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Immutable, content-hashed build assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker/manifest and the HTML shell must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets shipped in public/
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Fail closed if an unexpected API call reaches this container.
    location /api/ {
        return 404;
    }
}
